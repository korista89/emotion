<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBRST 행동데이터 시스템 • 로그인/중재회기/편집</title>
<style>
  :root{
    --brand:#4a90e2; --bg:#f6f7fb; --ink:#222; --muted:#6b7280; --danger:#e74c3c;
    --card:#ffffff; --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family: ui-sans-serif,system-ui,-apple-system,"Malgun Gothic","맑은 고딕",Segoe UI,Arial}
  .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
  .hdr{background:var(--brand);color:#fff;padding:18px 20px}
  .tabs{display:flex;background:#eef2f7;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:12px 8px;text-align:center;font-weight:700;border:none;background:transparent;cursor:pointer}
  .tab.active{background:#fff;color:var(--brand)}
  .body{padding:18px}
  label{font-weight:700;color:#374151}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  textarea{resize:vertical}
  .grid{display:grid;gap:12px}
  .row2{grid-template-columns:180px 1fr;align-items:center}
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
  .btn:hover{filter:brightness(.95)}
  .btn-danger{background:var(--danger)}
  .btn-ghost{background:#e5eefc;color:#1f4ed8}
  .btn-muted{background:#e5e7eb;color:#111827}
  .btn-small{padding:6px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;border:1px solid var(--line)}
  th,td{border-top:1px solid var(--line);padding:10px 8px;text-align:center;font-size:13px}
  th{background:#f9fafb}
  .msg{margin-top:10px;padding:10px;border-radius:10px;font-size:13px}
  .ok{background:#e8f5e9;color:#216e39}
  .bad{background:#fdecea;color:#b71c1c}
  .note{font-size:12px;color:var(--muted)}
  #chartCanvas{border:1px solid var(--line);border-radius:10px;margin-top:12px}
  .hidden{display:none !important}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .right{margin-left:auto}
  .pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 10px;border-radius:999px;background:#fff}
  .muted{color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .modal .panel{width:min(480px,100%);background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
  .brand i{width:14px;height:14px;background:#fff;border-radius:3px;box-shadow:inset 0 0 0 2px #1d4ed8}
  .kicker{color:#335e99;font-weight:700}
  /* JS self-check banner */
  #jsWarning{position:fixed;left:12px;right:12px;bottom:12px;background:#fff3cd;color:#7a5a00;border:1px solid #ffe08a;padding:10px 12px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:9999}
  #jsWarning.hidden{display:none}
</style>
</head>
<body>

<!-- JS 차단 환경 안내 -->
<div id="jsWarning">⚠️ 이 페이지는 자바스크립트가 필요합니다. 현재 뷰어가 스크립트를 차단한 것 같습니다. Chrome/Edge에서 열거나 웹 주소로 접속하세요.</div>

<div class="wrap">
  <div class="card">
    <div class="hdr">
      <div class="brand"><i></i> IBRST 행동데이터 시스템</div>
      <div class="note">로그인 후 학급별 데이터 입력·수정·차트 분석</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="input">데이터 입력</button>
      <button class="tab" data-tab="chart">차트 분석</button>
      <button class="tab" data-tab="register">학생 등록</button>
      <button class="tab hidden" id="adminTab" data-tab="admin">관리(ADMIN)</button>
    </div>

    <div class="body">
      <!-- 입력 탭 -->
      <section id="input" class="tab-pane">
        <div class="grid row2">
          <label>학생 선택</label>
          <select id="studentSelect"><option value="">-- 학생 선택 --</option></select>

          <label>날짜</label>
          <input type="date" id="dateInput">

          <label>증가 점수 (0–5)</label>
          <select id="incSelect"><option value="">선택</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>

          <label>감소 점수 (0–5)</label>
          <select id="decSelect"><option value="">선택</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>

          <label>메모</label>
          <textarea id="memoInput" rows="2" placeholder="짧은 메모 (선택)"></textarea>
        </div>

        <div class="toolbar" style="margin-top:10px">
          <button class="btn" id="saveBtn">데이터 저장</button>
          <button class="btn-muted" id="clearBtn">입력 초기화</button>
          <span class="pill">
            <span>중재 시작 회기</span>
            <input id="interventionStart" type="number" min="1" value="4" style="width:80px;padding:6px 10px">
            <button class="btn-ghost" id="saveInterventionStart">저장</button>
          </span>
          <span class="right note">저장 후 날짜는 자동으로 +1일 이동</span>
        </div>

        <div id="inputMsg" class="msg hidden"></div>

        <h3 style="margin:14px 0 8px;">데이터 기록</h3>
        <table id="dataTable">
          <thead>
            <tr>
              <th>회기</th><th>날짜</th><th>증가</th><th>감소</th><th>메모</th><th>작업</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- 차트 탭 -->
      <section id="chart" class="tab-pane hidden">
        <div class="grid row2">
          <label>학생 선택</label>
          <select id="chartStudent"><option value="">-- 학생 선택 --</option></select>
        </div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn" id="drawBtn">차트 그리기</button>
          <span class="pill"><span>중재 시작 회기</span><span id="chartIntervention" class="kicker">-</span></span>
        </div>
        <canvas id="chartCanvas" width="940" height="520" class="hidden"></canvas>
        <div id="analysis" class="hidden"></div>
      </section>

      <!-- 학생 등록 탭 -->
      <section id="register" class="tab-pane hidden">
        <div class="grid row2">
          <label>학생 이름</label><input id="stName" placeholder="예: 김민수">
          <label>학년</label>
          <select id="stGrade"><option value="">-- 선택 --</option><option>유치원</option><option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select>
          <label>증가 목표행동</label><input id="stInc" placeholder="예: 과제참여">
          <label>감소 목표행동</label><input id="stDec" placeholder="예: 자리이탈">
        </div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn" id="regBtn">학생 등록</button>
          <button class="btn-muted" id="resetLocal">로컬 데이터 초기화</button>
        </div>
        <div id="regMsg" class="msg hidden"></div>
      </section>

      <!-- 관리자 탭 -->
      <section id="admin" class="tab-pane hidden">
        <h3>관리자 설정</h3>
        <div class="grid row2" style="margin-top:6px">
          <label>Google Sheet URL</label><input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/...">
        </div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn" id="saveUrl">시트 URL 저장</button>
          <button class="btn-ghost" id="pullAll">서버 → 로컬 동기화</button>
        </div>
        <div class="note" style="margin-top:8px">관리자는 전체 데이터를 확인하고 동기화할 수 있습니다.</div>
      </section>
    </div>
  </div>
</div>

<!-- 로그인 모달 -->
<div class="modal hidden" id="loginModal">
  <div class="panel">
    <div class="brand" style="margin-bottom:8px"><i></i> IBRST 로그인</div>
    <div class="note" style="margin-bottom:10px">학급을 선택하고 비밀번호를 입력하세요. (A~F / A123, B123 … F123)</div>
    <div class="grid" style="gap:10px">
      <div class="grid row2">
        <label>역할</label>
        <select id="roleSel">
          <option value="class">담임/교사</option>
          <option value="admin">관리자</option>
        </select>
        <label>학급</label>
        <select id="classSel">
          <option value="A">A학급</option><option value="B">B학급</option><option value="C">C학급</option>
          <option value="D">D학급</option><option value="E">E학급</option><option value="F">F학급</option>
        </select>
        <label>비밀번호</label>
        <input type="password" id="pwInput" placeholder="A123 / ... / admin123">
      </div>
      <div class="toolbar">
        <button class="btn" id="loginBtn" type="button">로그인</button>
      </div>
      <div id="loginMsg" class="msg hidden"></div>
    </div>
  </div>
</div>

<script>
// ====== 전역 변수 및 상태 ======
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxCHjjR08I0sH_N0PiHpEKw5KpxxmiOU2_yBUQ-pY1ibo8bLSw0APBK_3YXj9X8eaA/exec"; // 배포된 Apps Script WebApp URL로 교체
let students = [];
let dataMap = {};
let me = { role: null, cls: null };

// ====== 유틸리티 함수들 ======
function q(sel) { return document.querySelector(sel); }
function qa(sel) { return Array.from(document.querySelectorAll(sel)); }
function today() { return new Date().toISOString().split("T")[0]; }
function uuid() { return "r" + Math.random().toString(36).slice(2) + Date.now().toString(36); }

function showMsg(elId, text, ok = true) {
  const el = typeof elId === 'string' ? document.getElementById(elId) : elId;
  if (!el) return;
  el.className = "msg " + (ok ? "ok" : "bad");
  el.textContent = text;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 2200);
}

function persist() {
  try {
    localStorage.setItem("ibrst_students", JSON.stringify(students));
    localStorage.setItem("ibrst_data", JSON.stringify(dataMap));
    localStorage.setItem("ibrst_me", JSON.stringify(me));
  } catch (e) {
    console.error('데이터 저장 실패:', e);
  }
}

function restore() {
  try {
    students = JSON.parse(localStorage.getItem("ibrst_students") || "[]");
    dataMap = JSON.parse(localStorage.getItem("ibrst_data") || "{}");
    me = JSON.parse(localStorage.getItem("ibrst_me") || "{}");
  } catch (e) {
    console.error('데이터 복원 실패:', e);
    students = [];
    dataMap = {};
    me = { role: null, cls: null };
  }
}

// ====== 로그인 관련 함수들 ======
function openLogin() {
  const modal = q("#loginModal");
  if (modal) {
    modal.classList.remove("hidden");
    setTimeout(() => {
      const pwInput = q("#pwInput");
      if (pwInput) pwInput.focus();
    }, 100);
  }
}

function closeLogin() {
  const modal = q("#loginModal");
  if (modal) {
    modal.classList.add("hidden");
    const pwInput = q("#pwInput");
    if (pwInput) pwInput.value = "";
  }
}

function verifyLogin() {
  const role = q("#roleSel")?.value;
  const cls = q("#classSel")?.value;
  const pw = q("#pwInput")?.value?.trim();
  
  if (!pw) {
    showMsg("loginMsg", "비밀번호를 입력하세요.", false);
    return;
  }
  
  if (role === "admin") {
    if (pw !== "admin123") {
      showMsg("loginMsg", "관리자 비밀번호가 올바르지 않습니다.", false);
      return;
    }
    me = { role: "admin", cls: "ALL" };
    const adminTab = q("#adminTab");
    if (adminTab) adminTab.classList.remove("hidden");
  } else {
    const expectedPw = cls + "123";
    if (pw !== expectedPw) {
      showMsg("loginMsg", "학급 비밀번호가 올바르지 않습니다.", false);
      return;
    }
    me = { role: "class", cls };
  }
  
  persist();
  closeLogin();
  populateStudentSelects();
  showMsg("inputMsg", "로그인되었습니다.", true);
}

function requireAuth() {
  restore();
  if (!me.role) {
    openLogin();
  } else {
    if (me.role === "admin") {
      const adminTab = q("#adminTab");
      if (adminTab) adminTab.classList.remove("hidden");
    }
    populateStudentSelects();
  }
}

// ====== 학생 관련 함수들 ======
function getStudent(id) {
  return students.find(s => s.id === id) || {};
}

function populateStudentSelects() {
  const s1 = q("#studentSelect");
  const s2 = q("#chartStudent");
  if (!s1 || !s2) return;
  
  const list = students.filter(st => me.role === "admin" || st.cls === me.cls);
  const opts = ['<option value="">-- 학생 선택 --</option>']
    .concat(list.map(st => `<option value="${st.id}">${st.name} (${st.grade})</option>`));
  
  s1.innerHTML = opts.join("");
  s2.innerHTML = opts.join("");
}

async function registerStudent() {
  if (me.role !== "admin" && me.role !== "class") {
    openLogin();
    return;
  }
  
  const name = q("#stName")?.value?.trim();
  const grade = q("#stGrade")?.value;
  const inc = q("#stInc")?.value?.trim();
  const dec = q("#stDec")?.value?.trim();
  
  if (!name || !grade || !inc || !dec) {
    showMsg("regMsg", "모든 항목을 입력하세요.", false);
    return;
  }

  const st = {
    id: "s" + Date.now(),
    name,
    grade,
    incBehavior: inc,
    decBehavior: dec,
    cls: (me.role === "admin" ? "A" : me.cls),
    interventionStart: 4
  };
  
  students.push(st);
  dataMap[st.id] = [];
  persist();
  populateStudentSelects();

  if (WEBAPP_URL) {
    try {
      await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "registerStudent", student: st })
      });
    } catch (e) {
      console.error('서버 동기화 실패:', e);
    }
  }
  
  // 입력 필드 초기화
  const fields = ["#stName", "#stGrade", "#stInc", "#stDec"];
  fields.forEach(sel => {
    const el = q(sel);
    if (el) el.value = "";
  });
  
  showMsg("regMsg", "학생이 등록되었습니다.");
}

// ====== 데이터 관련 함수들 ======
function renumberSessions(studentId) {
  const arr = (dataMap[studentId] || []).slice().sort((a, b) =>
    a.date.localeCompare(b.date) || a.timestamp - b.timestamp
  );
  let n = 1;
  for (const r of arr) {
    r.session = n++;
  }
  dataMap[studentId] = arr;
}

async function onPickStudent() {
  const id = q("#studentSelect")?.value;
  if (!id) {
    const tbody = q("#dataTable tbody");
    if (tbody) tbody.innerHTML = "";
    return;
  }

  if (WEBAPP_URL) {
    try {
      const res = await fetch(`${WEBAPP_URL}?action=getStudentData&studentId=${encodeURIComponent(id)}`);
      const payload = await res.json();
      if (Array.isArray(payload.records)) {
        dataMap[id] = payload.records;
        persist();
      }
    } catch (e) {
      console.error('서버에서 데이터 가져오기 실패:', e);
    }
  }
  
  const student = getStudent(id);
  const interventionInput = q("#interventionStart");
  if (interventionInput) {
    interventionInput.value = (student.interventionStart || 4);
  }
  renderTable(id);
}

async function onSave() {
  const stId = q("#studentSelect")?.value;
  const date = q("#dateInput")?.value;
  const inc = parseInt(q("#incSelect")?.value);
  const dec = parseInt(q("#decSelect")?.value);
  const memo = q("#memoInput")?.value?.trim() || "";
  
  if (!stId) {
    showMsg("inputMsg", "학생을 선택하세요.", false);
    return;
  }
  if (!date || isNaN(inc) || isNaN(dec)) {
    showMsg("inputMsg", "날짜와 점수를 입력하세요.", false);
    return;
  }

  const arr = dataMap[stId] || (dataMap[stId] = []);
  const found = arr.find(r => r.date === date);
  
  if (found) {
    found.inc = inc;
    found.dec = dec;
    found.memo = memo;
    found.timestamp = Date.now();
  } else {
    arr.push({
      id: uuid(),
      date,
      inc,
      dec,
      memo,
      timestamp: Date.now()
    });
  }
  
  renumberSessions(stId);
  persist();

  if (WEBAPP_URL) {
    try {
      const rec = arr.find(r => r.date === date);
      await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "upsertRecord",
          studentId: stId,
          record: rec
        })
      });
    } catch (e) {
      console.error('서버 저장 실패:', e);
    }
  }

  // 날짜를 다음날로 자동 이동
  const d = new Date(date);
  d.setDate(d.getDate() + 1);
  const dateInput = q("#dateInput");
  if (dateInput) {
    dateInput.value = d.toISOString().split("T")[0];
  }
  
  // 입력 필드 초기화
  const incSelect = q("#incSelect");
  const decSelect = q("#decSelect");
  const memoInput = q("#memoInput");
  if (incSelect) incSelect.value = "";
  if (decSelect) decSelect.value = "";
  if (memoInput) memoInput.value = "";
  
  renderTable(stId);
  showMsg("inputMsg", "저장되었습니다.");
}

function renderTable(studentId) {
  renumberSessions(studentId);
  const arr = dataMap[studentId] || [];
  const tbody = q("#dataTable tbody");
  if (!tbody) return;
  
  if (arr.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted">데이터가 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = arr.map(r => {
    const escapedMemo = (r.memo || '').replace(/"/g, '&quot;');
    return `<tr data-id="${r.id}">
      <td>${r.session}</td>
      <td><input type="date" class="edit-date" value="${r.date}" /></td>
      <td>
        <select class="edit-inc">
          ${[0,1,2,3,4,5].map(v => `<option value="${v}" ${r.inc === v ? 'selected' : ''}>${v}</option>`).join("")}
        </select>
      </td>
      <td>
        <select class="edit-dec">
          ${[0,1,2,3,4,5].map(v => `<option value="${v}" ${r.dec === v ? 'selected' : ''}>${v}</option>`).join("")}
        </select>
      </td>
      <td><input class="edit-memo" value="${escapedMemo}" placeholder="-" /></td>
      <td>
        <button class="btn-ghost btn-small" onclick="saveRow('${studentId}','${r.id}')">수정</button>
        <button class="btn-danger btn-small" onclick="removeRow('${studentId}','${r.id}')">삭제</button>
      </td>
    </tr>`;
  }).join("");
}

async function saveRow(studentId, recId) {
  const tr = q(`tr[data-id="${recId}"]`);
  if (!tr) return;
  
  const date = tr.querySelector(".edit-date")?.value;
  const inc = parseInt(tr.querySelector(".edit-inc")?.value);
  const dec = parseInt(tr.querySelector(".edit-dec")?.value);
  const memo = tr.querySelector(".edit-memo")?.value?.trim() || "";
  
  const arr = dataMap[studentId] || [];
  const r = arr.find(x => x.id === recId);
  if (!r) return;
  
  r.date = date;
  r.inc = inc;
  r.dec = dec;
  r.memo = memo;
  r.timestamp = Date.now();
  
  renumberSessions(studentId);
  persist();
  renderTable(studentId);
  
  if (WEBAPP_URL) {
    try {
      await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "upsertRecord",
          studentId: studentId,
          record: r
        })
      });
    } catch (e) {
      console.error('서버 수정 실패:', e);
    }
  }
}

async function removeRow(studentId, recId) {
  if (!confirm("이 레코드를 삭제할까요?")) return;
  
  let arr = dataMap[studentId] || [];
  const idx = arr.findIndex(x => x.id === recId);
  
  if (idx >= 0) {
    arr.splice(idx, 1);
    dataMap[studentId] = arr;
    renumberSessions(studentId);
    persist();
    renderTable(studentId);
    
    if (WEBAPP_URL) {
      try {
        await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "deleteRecord",
            studentId: studentId,
            recordId: recId
          })
        });
      } catch (e) {
        console.error('서버 삭제 실패:', e);
      }
    }
  }
}

async function saveInterventionStart() {
  const stId = q("#studentSelect")?.value;

// ====== 차트 관련 함수들 ======
function drawChart() {
  const stId = q("#chartStudent")?.value;
  if (!stId) {
    alert("학생을 선택하세요.");
    return;
  }
  
  const st = getStudent(stId);
  const data = (dataMap[stId] || []).slice().sort((a, b) => a.session - b.session);
  
  if (data.length < 1) {
    alert("데이터가 없습니다.");
    return;
  }

  const canvas = q("#chartCanvas");
  if (!canvas) return;
  
  canvas.classList.remove("hidden");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);

  const padL = 70, padT = 60, padR = 60, padB = 90;
  const cw = W - padL - padR, ch = H - padT - padB;

  // 제목
  ctx.fillStyle = "#111";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "center";
  ctx.fillText(`${st.name} 행동 데이터`, W / 2, 28);

  // 격자선
  ctx.strokeStyle = "#e5e7eb";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = padT + (ch / 5) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + cw, y);
    ctx.stroke();
  }

  const xStep = cw / Math.max(1, (data.length - 1));
  for (let i = 0; i < data.length; i++) {
    const x = padL + i * xStep;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + ch);
    ctx.stroke();
  }

  // 축
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT + ch);
  ctx.lineTo(padL + cw, padT + ch);
  ctx.stroke();

  // Y축 레이블
  ctx.fillStyle = "#222";
  ctx.font = "12px Arial";
  ctx.textAlign = "right";
  for (let i = 0; i <= 5; i++) {
    const y = padT + ch - (ch / 5) * i;
    ctx.beginPath();
    ctx.moveTo(padL - 5, y);
    ctx.lineTo(padL, y);
    ctx.stroke();
    ctx.fillText(i, padL - 10, y + 4);
  }

  // X축 레이블
  ctx.textAlign = "center";
  ctx.font = "11px Arial";
  data.forEach((d, i) => {
    const x = padL + i * xStep;
    const dt = new Date(d.date);
    const ds = `${dt.getMonth() + 1}/${dt.getDate()}`;
    ctx.beginPath();
    ctx.moveTo(x, padT + ch);
    ctx.lineTo(x, padT + ch - 5);
    ctx.stroke();
    ctx.fillText(`${ds}`, x, padT + ch + 18);
    ctx.fillText(`${d.session}회기`, x, padT + ch + 34);
  });

  const start = Math.max(1, st.interventionStart || 4);
  const chartIntervention = q("#chartIntervention");
  if (chartIntervention) chartIntervention.textContent = start;
  
  const base = data.filter(d => d.session < start);
  const inter = data.filter(d => d.session >= start);
  const y = s => padT + ch - (s / 5) * ch;

  // 증가 행동 선
  ctx.strokeStyle = "#4a90e2";
  ctx.lineWidth = 2;
  ctx.beginPath();
  base.forEach((d, i) => {
    const x = padL + i * xStep;
    const yy = y(d.inc);
    if (i === 0) ctx.moveTo(x, yy);
    else ctx.lineTo(x, yy);
  });
  ctx.stroke();

  if (inter.length > 0) {
    ctx.beginPath();
    inter.forEach((d, i) => {
      const x = padL + (base.length + i) * xStep;
      const yy = y(d.inc);
      if (i === 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    });
    ctx.stroke();
  }

  // 감소 행동 선
  ctx.strokeStyle = "#e74c3c";
  ctx.lineWidth = 2;
  ctx.beginPath();
  base.forEach((d, i) => {
    const x = padL + i * xStep;
    const yy = y(d.dec);
    if (i === 0) ctx.moveTo(x, yy);
    else ctx.lineTo(x, yy);
  });
  ctx.stroke();

  if (inter.length > 0) {
    ctx.beginPath();
    inter.forEach((d, i) => {
      const x = padL + (base.length + i) * xStep;
      const yy = y(d.dec);
      if (i === 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    });
    ctx.stroke();
  }

  // 데이터 포인트
  data.forEach((d, i) => {
    const x = padL + i * xStep;

    // 증가 행동 포인트 (원)
    let yy = y(d.inc);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#4a90e2";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, yy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#4a90e2";
    ctx.font = "bold 11px Arial";
    ctx.fillText(d.inc, x, yy - 10);

    // 감소 행동 포인트 (삼각형)
    yy = y(d.dec);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#e74c3c";
    ctx.beginPath();
    ctx.moveTo(x, yy - 6);
    ctx.lineTo(x - 5, yy + 4);
    ctx.lineTo(x + 5, yy + 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#e74c3c";
    ctx.fillText(d.dec, x, yy + 20);
  });

  // 중재선
  if (inter.length > 0) {
    const xL = padL + (start - 1 - 1) * xStep;
    const xR = padL + (start - 1) * xStep;
    const xc = (xL + xR) / 2;
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(xc, padT);
    ctx.lineTo(xc, padT + ch);
    ctx.stroke();
  }

  // 단계 레이블
  ctx.fillStyle = "#111";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  if (base.length > 0) {
    ctx.fillText("기초선", padL + (base.length - 1) * xStep / 2, padT - 12);
  }
  if (inter.length > 0) {
    ctx.fillText("중재", padL + (base.length + inter.length - 1) * xStep / 2, padT - 12);
  }

  renderAnalysis(st, base, inter);
}

function renderAnalysis(st, base, inter) {
  const el = q("#analysis");
  if (!el) return;
  
  el.classList.remove("hidden");

  const mean = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
  const baseInc = mean(base.map(d => d.inc));
  const intInc = mean(inter.map(d => d.inc));
  const baseDec = mean(base.map(d => d.dec));
  const intDec = mean(inter.map(d => d.dec));
  const pctInc = baseInc ? ((intInc - baseInc) / baseInc * 100).toFixed(1) : "—";
  const pctDec = baseDec ? ((baseDec - intDec) / baseDec * 100).toFixed(1) : "—";

  el.innerHTML = `<div class="msg ok"><b>${st.name}</b> 기초선→중재 변화 | 증가: ${baseInc.toFixed(2)} → ${intInc.toFixed(2)} (${pctInc}%) · 감소: ${baseDec.toFixed(2)} → ${intDec.toFixed(2)} (${pctDec}% 감소)</div>`;
}

// ====== 관리자 관련 함수들 ======
async function saveSheetUrl() {
  const url = q("#sheetUrl")?.value?.trim();
  if (!url) {
    alert("Sheet URL을 입력하세요.");
    return;
  }
  if (!WEBAPP_URL) {
    alert("WEBAPP_URL을 HTML 상단에 설정하세요.");
    return;
  }

  try {
    await fetch(WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "setSheetUrl",
        sheetUrl: url
      })
    });
    localStorage.setItem("ibrst_sheet_url_cache", url);
    showMsg("analysis", "시트 URL이 저장되었습니다.");
  } catch (e) {
    alert("저장 실패: " + e);
  }
}

async function syncFromServer() {
  if (!WEBAPP_URL) {
    alert("WEBAPP_URL을 HTML 상단에 설정하세요.");
    return;
  }

  try {
    const res = await fetch(`${WEBAPP_URL}?action=getAll`);
    const payload = await res.json();

    if (payload && Array.isArray(payload.students)) {
      students = payload.students;
      dataMap = payload.dataRecords || {};

      Object.keys(dataMap).forEach(k => {
        dataMap[k].forEach(r => {
          r.id = r.id || ("r" + Math.random().toString(36).slice(2) + Date.now().toString(36));
          r.inc = (typeof r.inc === 'undefined') ? r.incScore : r.inc;
          r.dec = (typeof r.dec === 'undefined') ? r.decScore : r.dec;
        });
        renumberSessions(k);
      });

      persist();
      populateStudentSelects();
      showMsg("analysis", "서버에서 데이터를 불러왔습니다.");
    } else {
      alert("서버 응답이 올바르지 않습니다.");
    }
  } catch (e) {
    alert("동기화 실패: " + e);
  }
}

// ====== 이벤트 바인딩 ======
function bindEvents() {
  // 탭 이벤트
  qa(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      qa(".tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      qa(".tab-pane").forEach(p => p.classList.add("hidden"));
      const targetPane = q("#" + btn.dataset.tab);
      if (targetPane) targetPane.classList.remove("hidden");
    });
  });

  // 로그인 관련
  const loginBtn = q("#loginBtn");
  if (loginBtn) loginBtn.addEventListener("click", verifyLogin);

  const pwInput = q("#pwInput");
  if (pwInput) {
    pwInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        verifyLogin();
      }
    });
  }

  // 데이터 입력 관련
  const saveBtn = q("#saveBtn");
  if (saveBtn) saveBtn.addEventListener("click", onSave);

  const clearBtn = q("#clearBtn");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      const incSelect = q("#incSelect");
      const decSelect = q("#decSelect");
      const memoInput = q("#memoInput");
      if (incSelect) incSelect.value = "";
      if (decSelect) decSelect.value = "";
      if (memoInput) memoInput.value = "";
    });
  }

  const studentSelect = q("#studentSelect");
  if (studentSelect) studentSelect.addEventListener("change", onPickStudent);

  const saveInterventionBtn = q("#saveInterventionStart");
  if (saveInterventionBtn) saveInterventionBtn.addEventListener("click", saveInterventionStart);

  // 학생 등록 관련
  const regBtn = q("#regBtn");
  if (regBtn) regBtn.addEventListener("click", registerStudent);

  const resetLocalBtn = q("#resetLocal");
  if (resetLocalBtn) {
    resetLocalBtn.addEventListener("click", () => {
      if (confirm("모든 로컬 데이터를 삭제하시겠습니까?")) {
        localStorage.clear();
        location.reload();
      }
    });
  }

  // 차트 관련
  const drawBtn = q("#drawBtn");
  if (drawBtn) drawBtn.addEventListener("click", drawChart);

  // 관리자 관련
  const saveUrlBtn = q("#saveUrl");
  if (saveUrlBtn) saveUrlBtn.addEventListener("click", saveSheetUrl);

  const pullAllBtn = q("#pullAll");
  if (pullAllBtn) pullAllBtn.addEventListener("click", syncFromServer);
}

// ====== 초기화 ======
function initApp() {
  // JS 경고 숨기기
  const jsWarning = q("#jsWarning");
  if (jsWarning) jsWarning.classList.add("hidden");

  // 오늘 날짜 설정
  const dateInput = q("#dateInput");
  if (dateInput) dateInput.value = today();

  // 이벤트 바인딩
  bindEvents();

  // 데이터 복원 및 인증 확인
  restore();
  requireAuth();
}

// DOM 로드 완료 시 초기화
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
